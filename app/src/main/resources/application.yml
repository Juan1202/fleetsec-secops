# ──────────────────────────────────────────────────────────────────────────────
# FleetSec Vulnerable App — configuración
#
# V-10 REMEDIADO (FSEC-17): los secretos (app.jwt.secret, app.admin.password) se
# leen de variables de entorno, sin literales en el repo. Provisión: .env local
# (gitignored) / repo secrets en CI / secret manager en prod (Sprint 3). Ver ADR-010.
# ──────────────────────────────────────────────────────────────────────────────

server:
  port: 8080

spring:
  application:
    name: fleetsec-vulnerable-app
  datasource:
    url: jdbc:h2:mem:fleetsec;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Config de la app ──────────────────────────────────────────────────────────
app:
  # V-10 remediado: secretos externalizados a variables de entorno.
  # Sin default en jwt.secret / admin.password → si faltan, el contexto NO levanta
  # (fail-fast, no default silencioso). Ver .env.example y ADR-010.
  jwt:
    secret: ${APP_JWT_SECRET}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD}
  # Directorio base de reportes (V06). En contenedor: /app/reports.
  reports:
    dir: "reports"
  # V-07 remediado: rate limiting de login (ventana deslizante por IP).
  ratelimit:
    login:
      max-attempts: 5
      window-seconds: 60

logging:
  level:
    co.fleetsec.vapp: INFO
