# ──────────────────────────────────────────────────────────────────────────────
# FleetSec Vulnerable App — docker-compose
# Un comando levanta el entorno de demostración (bonus +5%):
#   cd app && cp .env.example .env  (completar valores)  &&  docker compose up -d
# Requiere APP_JWT_SECRET y APP_ADMIN_PASSWORD en el entorno (o en app/.env) — V-10.
# App disponible en http://localhost:8080 · OpenAPI en /v3/api-docs · Swagger en /swagger-ui.html
# ──────────────────────────────────────────────────────────────────────────────

services:
  vulnerable-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleetsec/vulnerable-app:fsec12
    container_name: fleetsec-vulnerable-app
    ports:
      - "8080:8080"
    # V-10: secretos por entorno con fail-fast (${VAR:?...} aborta si falta).
    environment:
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD is required}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/v3/api-docs"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 45s
    restart: unless-stopped
