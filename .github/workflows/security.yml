name: DevSecOps Security Pipeline

# ──────────────────────────────────────────────────────────────────────────────
# FSEC-13 · Pipeline DevSecOps de 8 stages sobre la app vulnerable (app/).
# Gates: 0 CRITICAL/HIGH sin supresión auditada · SARIF al Security tab · SBOM ·
# ≤15 min PR / ≤25 min main. Stages 2-5 en paralelo (jobs independientes).
#
# Stages:
#   2 SAST       (Semgrep + 2 custom rules)      job: sast
#   3 SCA        (Trivy fs)                       job: sca
#   4 Container  (Trivy image)                    job: container
#   5 IaC        (Checkov)                         job: iac
#   6 DAST       (OWASP ZAP autenticado)          job: dast
#   7 SBOM       (Syft → CycloneDX)               job: sbom
#   8 Secrets    (gitleaks)                        job: secrets
#   + commitlint (Conventional Commits)           job: commitlint
#   + security-gate (agrega resultados)           job: security-gate
# ──────────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# ⚠️ permissions mínimo explícito (NO el default amplio)
# issues:write NO va aquí: se declara per-job solo en el job que crea issues
# (dast → auto-issue MEDIUM; break-glass en FSEC-14). Menor privilegio: sast/sca/
# container/iac/sbom/secrets no pueden tocar issues → limita blast radius si una
# action de terceros se compromete.
permissions:
  contents: read
  security-events: write   # upload SARIF a Code Scanning
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Conventional Commits ────────────────────────────────────────────────────
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - validar Conventional Commits del PR"

  # ── Stage 2 · SAST ──────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Hereda top-level: contents:read (checkout) + security-events:write (SARIF).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep scan (registry rulesets + custom rules → SARIF)
        # semgrep vía Docker: evita instalar y aísla la versión. Registry rulesets
        # p/java, p/owasp-top-ten, p/secrets + las 2 custom rules de pipeline/semgrep/.
        # continue-on-error: el scan "encuentra" (exit!=0) pero el gate decide abajo.
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan \
              --config p/java \
              --config p/owasp-top-ten \
              --config p/secrets \
              --config /src/pipeline/semgrep/ \
              /src/app \
              --sarif --output /src/semgrep.sarif

      - name: Upload SARIF a Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gate — fallar en findings ERROR (≈ HIGH/CRITICAL)
        run: |
          # Semgrep deja result.level vacío y pone la severidad en la regla
          # (rule.defaultConfiguration.level). El gate resuelve el nivel efectivo:
          # result.level // regla.defaultConfiguration.level // "warning".
          eff='[ .runs[] as $r | $r.results[] | . as $res
                 | ( $res.level
                     // ( $r.tool.driver.rules[] | select(.id==$res.ruleId) | .defaultConfiguration.level )
                     // "warning" ) as $lvl'
          errors=$(jq "$eff | select(\$lvl==\"error\") ] | length" semgrep.sarif)
          warns=$(jq "$eff | select(\$lvl==\"warning\") ] | length" semgrep.sarif)
          echo "Semgrep findings — ERROR: $errors · WARNING: $warns"
          if [ "$errors" -gt 0 ]; then
            echo "::error::SAST gate FAIL — $errors findings ERROR (ver Security tab)"
            exit 1
          fi
          echo "SAST gate PASS (0 ERROR)"

  # ── Stage 3 · SCA ───────────────────────────────────────────────────────────
  sca:
    name: SCA (Trivy fs)
    runs-on: ubuntu-latest
    # Hereda top-level: contents:read + security-events:write (SARIF).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (+ cache Maven)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build fat jar
        # Se escanea el jar construido, NO el pom.xml: Trivy resolviendo pom.xml
        # golpea rate-limit (429) de Maven Central y aborta. El fat jar embebe
        # todas las deps transitivas → Trivy las detecta sin resolución remota.
        working-directory: app
        run: mvn -B -q clean package -DskipTests

      - name: Trivy fs sobre el jar → SARIF
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            fs --scanners vuln --format sarif --output /src/trivy-sca.sarif \
            /src/app/target/vulnerable-app.jar

      - name: Upload SARIF a Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca

      - name: "Gate — CVSS >= 8.0 (superset de >=8.0 directas / >=9.0 transitivas)"
        run: |
          # Spec: fallar en CVSS≥8.0 deps directas, ≥9.0 transitivas. Distinguir
          # directa/transitiva desde el jar no es fiable, así que se aplica un gate
          # conservador (superset): cualquier CVSS≥8.0 falla. Trivy SARIF pone el
          # CVSS en rule.properties."security-severity".
          n=$(jq '[ .runs[] as $r | $r.results[] | . as $res
                    | ( $r.tool.driver.rules[] | select(.id==$res.ruleId)
                        | .properties."security-severity" | tonumber? // 0 ) as $s
                    | select($s >= 8.0) ] | length' trivy-sca.sarif)
          echo "SCA — vulnerabilidades con CVSS ≥ 8.0: $n"
          if [ "$n" -gt 0 ]; then
            echo "::error::SCA gate FAIL — $n deps con CVSS ≥ 8.0 (ver Security tab)"
            exit 1
          fi
          echo "SCA gate PASS"

  # ── Stage 4 · Container ─────────────────────────────────────────────────────
  container:
    name: Container (Trivy image)
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - build imagen + Trivy image → SARIF"

  # ── Stage 5 · IaC ───────────────────────────────────────────────────────────
  iac:
    name: IaC (Checkov)
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - Checkov sobre Dockerfile/compose/terraform → SARIF"

  # ── Stage 7 · SBOM ──────────────────────────────────────────────────────────
  sbom:
    name: SBOM (Syft → CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - Syft → CycloneDX JSON → artifact"

  # ── Stage 8 · Secrets ───────────────────────────────────────────────────────
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    # Hereda el top-level: contents:read (checkout) + security-events:write (SARIF).
    #
    # ⚠️ Cobertura de V10 (hardcoded credentials): este stage pasa VERDE sobre
    # app/src/main/resources/application.yml. NO es un gap. gitleaks detecta
    # secretos por firma/entropía (claves AWS, tokens JWT emitidos, PEM), no
    # secretos SEMÁNTICOS de config como `app.jwt.secret: <literal legible>`.
    # V10 lo cubre el Stage 2 (SAST) con la custom rule fleetsec-hardcoded-secret-in-yaml
    # (severidad ERROR → bloquea). Cada herramienta en su dominio; no se duplica
    # el finding en dos SARIF. Ver pipeline/README.md § "Cobertura por vector".
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks escanea el historial de commits, no solo el árbol de trabajo.
          fetch-depth: 0

      - name: gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # gitleaks-action sube el SARIF a Code Scanning automáticamente.
          # Repo público individual → sin licencia requerida.


  # ── Stage 6 · DAST ──────────────────────────────────────────────────────────
  # El más pesado: levanta la app y corre ZAP autenticado vía OpenAPI.
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [container]
    # Menor privilegio: este job SÍ crea el auto-issue MEDIUM, por eso eleva
    # issues:write solo aquí. Hereda el resto del top-level.
    permissions:
      contents: read
      issues: write
    steps:
      - run: echo "TODO - docker compose up + ZAP auth scan sobre OpenAPI"

  # ── Gate final · agrega resultados ──────────────────────────────────────────
  # NOTA: la política verde/rojo se decide en ADR-004 con findings reales.
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [sast, sca, container, iac, dast, sbom, secrets, commitlint]
    if: always()
    steps:
      - run: echo "TODO - agregar resultados de todos los stages y decidir gate (ADR-004)"
