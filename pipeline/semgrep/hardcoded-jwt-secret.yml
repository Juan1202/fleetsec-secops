rules:
  # ===========================================================================
  # FleetSec custom rule · hardcoded-jwt-secret
  # ===========================================================================
  # Detecta secretos hardcoded (JWT signing keys, passwords, DB creds) en
  # archivos de configuración YAML/properties y en código Java.
  #
  # Cubre V10 (CWE-798) que gitleaks default NO caza porque no es un patrón
  # de alta entropía sino un campo password:/secret: con valor literal.
  #
  # Targets conocidos en la app:
  #   - src/main/resources/application.yml → app.jwt.secret, app.admin.password
  #   - JwtService constructor si alguien hardcodea el fallback
  # ===========================================================================

  - id: fleetsec-hardcoded-secret-in-yaml
    languages: [yaml]
    severity: ERROR
    message: >
      Secreto hardcoded detectado en archivo de configuración. Credenciales,
      JWT signing keys o passwords NO deben estar en texto plano en el repo.
      Usar variables de entorno, AWS Secrets Manager, o un vault. (CWE-798)
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      asvs: "2.10.4"
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
      confidence: HIGH
      vector: "V10"
    patterns:
      - pattern-regex: '(?i)(password|secret|api[_-]?key|token|credential)\s*:\s*["'']?(?!\$\{)(?!.*(YOUR_|<your|change[_-]?me|placeholder|example))[A-Za-z0-9!@#$%^&*()_+=\-]{8,}["'']?'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
        - "*.properties"
      exclude:
        - "*test*"
        - "*example*"

  - id: fleetsec-hardcoded-secret-in-java
    languages: [java]
    severity: ERROR
    message: >
      String literal que parece un secreto hardcoded en código Java. Los
      signing keys y passwords deben inyectarse por configuración externa,
      nunca como literal en el source. (CWE-798)
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      asvs: "2.10.4"
      references:
        - https://cwe.mitre.org/data/definitions/798.html
      confidence: MEDIUM
      vector: "V10"
    patterns:
      - pattern-either:
          - pattern: |
              String $VAR = "...";
          - pattern: |
              private static final String $VAR = "...";
      - metavariable-regex:
          metavariable: $VAR
          regex: '(?i).*(secret|password|passwd|pwd|apikey|api_key|token|credential).*'
      - pattern-not: |
          String $VAR = "";
    paths:
      exclude:
        - "*test*"
        - "*Test.java"
